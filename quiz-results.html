<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mac&Talk Quiz Results</title>
<style>
:root{--navy:#10243e;--yellow:#ffc629;--bg:#f3f6fb;--line:#e5eaf1;--muted:#718096;--gold:#f5c542;--silver:#b9c5d3;--bronze:#c98a55}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#e4edf9 0,#f3f6fb 48%,#edf2f8 100%);font:15px Inter,Arial,sans-serif;color:var(--navy)}
header{background:var(--navy);color:white;padding:18px 24px;font-weight:900;letter-spacing:.2px}
header span{color:var(--yellow)}
main{max-width:1050px;margin:32px auto;padding:0 18px 42px}
.panel{background:white;border:1px solid var(--line);border-radius:22px;padding:clamp(20px,3vw,34px);box-shadow:0 16px 45px #10243e0d}
.top{text-align:center;margin-bottom:26px}
.kicker{font-size:12px;font-weight:950;letter-spacing:3px;color:#9b7512;text-transform:uppercase}
h1{font-size:clamp(30px,4vw,48px);margin:9px 0 8px;font-weight:1000}
.muted{color:var(--muted);line-height:1.5}
.podium{display:grid;grid-template-columns:1fr 1.16fr 1fr;gap:clamp(9px,2vw,22px);align-items:end;max-width:820px;margin:25px auto 34px}
.winner{border:1px solid var(--line);border-radius:20px 20px 14px 14px;padding:18px 10px 17px;text-align:center;background:linear-gradient(180deg,#fff,#f7f9fc);min-width:0}
.winner.first{padding:27px 12px 25px;transform:translateY(-12px);border:2px solid #f0cf63;background:linear-gradient(180deg,#fff9e5,#fff);box-shadow:0 16px 34px #c99c2a24}
.medal{font-size:clamp(30px,4vw,46px);line-height:1.1;margin-bottom:8px}
.winner.first .medal{font-size:clamp(43px,5.2vw,64px)}
.place{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;font-weight:950;color:var(--muted)}
.winner.first .place{color:#9b7512}
.winner-name{font-size:clamp(15px,2vw,20px);font-weight:950;margin:9px 0 7px;overflow-wrap:anywhere}
.winner.first .winner-name{font-size:clamp(20px,2.7vw,29px)}
.winner-score{font-size:clamp(14px,1.7vw,18px);font-weight:900;color:#52647a}
.winner.first .winner-score{font-size:clamp(17px,2vw,22px);color:var(--navy)}
.podium-base{height:8px;border-radius:0 0 12px 12px;margin:0 8px;background:#dce4ee}
.first .podium-base{background:var(--gold);height:12px}
.second .podium-base{background:var(--silver)}
.third .podium-base{background:var(--bronze)}
.all-title{font-size:20px;font-weight:950;margin:28px 0 8px}
.results-list{border:1px solid var(--line);border-radius:15px;overflow:hidden}
.item{display:grid;grid-template-columns:55px minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);background:white}
.item:last-child{border-bottom:0}
.rank{font-weight:950;color:#8a6500}
.name{font-weight:850;overflow-wrap:anywhere}
.score{background:#fff2cf;padding:7px 11px;border-radius:9px;font-weight:950;white-space:nowrap}
@media(max-width:560px){main{margin:18px auto;padding:0 11px 28px}.panel{padding:17px 12px}.podium{gap:7px}.winner{padding:14px 5px 12px}.winner.first{padding:20px 6px 17px;transform:translateY(-7px)}.item{grid-template-columns:38px minmax(0,1fr) auto;padding:12px 10px;gap:7px}.score{padding:6px 7px;font-size:12px}}
</style>
</head>
<body>
<header>Mac<span>&</span>Talk · Quiz Results</header>
<main>
<section class="panel">
<div class="top">
<div class="kicker">Quiz completed</div>
<h1 id="title">Final Winners</h1>
<p class="muted" id="meta">Loading the final classement…</p>
</div>
<div class="podium" id="podium" aria-live="polite"></div>
<div class="all-title">Full classement</div>
<div class="results-list" id="results"></div>
</section>
</main>
<script type="module">
import{createClient}from"https://esm.sh/@supabase/supabase-js@2";
const sb=createClient("https://gprdmwjqgyrvqrgjkycc.supabase.co","sb_publishable_uBlQa2v-VS9OYVRk3FEE4A_CwmVPVH4");
const $=id=>document.getElementById(id),sid=new URLSearchParams(location.search).get("session");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function load(){
 if(!sid)throw Error("Missing session ID.");
 const{data:s,error}=await sb.from("quiz_sessions").select("id,pin,status,created_at,quizzes(title)").eq("id",sid).single();
 if(error)throw error;
 $("title").textContent=s.quizzes?.title||"Final Winners";
 $("meta").textContent="PIN "+s.pin+" · "+s.status+" · "+new Date(s.created_at).toLocaleString();
 const{data:players,error:e}=await sb.from("quiz_players").select("nickname,score").eq("session_id",sid).order("score",{ascending:false});
 if(e)throw e;
 const ranked=(players||[]).slice().sort((a,b)=>(Number(b.score)||0)-(Number(a.score)||0));
 const podiumOrder=[{p:ranked[1],rank:2,cls:"second",medal:"🥈"},{p:ranked[0],rank:1,cls:"first",medal:"🥇"},{p:ranked[2],rank:3,cls:"third",medal:"🥉"}];
 $("podium").innerHTML=podiumOrder.filter(x=>x.p).map(x=>`<div class="winner ${x.cls}"><div class="medal">${x.medal}</div><div class="place">${x.rank===1?"Champion":"Place "+x.rank}</div><div class="winner-name">${esc(x.p.nickname)}</div><div class="winner-score">${Number(x.p.score)||0} points</div><div class="podium-base"></div></div>`).join("");
 $("results").innerHTML=ranked.map((p,i)=>`<div class="item"><span class="rank">#${i+1}</span><span class="name">${esc(p.nickname)}</span><span class="score">${Number(p.score)||0} points</span></div>`).join("")||'<p class="muted" style="padding:16px">No players yet.</p>';
}
load().catch(e=>$("meta").textContent=e.message);
</script>
</body>
</html>
