:root{--navy:#10243e;--yellow:#ffc629;--bg:#f3f6fb;--line:#e5eaf1;--muted:#718096}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px Inter,Arial,sans-serif;color:var(--navy)}header{background:var(--navy);color:white;padding:18px 24px;font-weight:900}header span{color:var(--yellow)}main{max-width:850px;margin:30px auto;padding:0 16px}.panel{background:white;border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:0 12px 35px #10243e0d}h1{margin:0 0 8px}.muted{color:var(--muted)}.item{display:flex;justify-content:space-between;gap:12px;padding:15px;border-bottom:1px solid var(--line);align-items:center}.score{background:#fff2cf;padding:6px 11px;border-radius:9px;font-weight:900}
</style></head><body><header>Mac<span>&</span>Talk · Quiz Results</header><main><section class="panel"><h1 id="title">Quiz results</h1><p class="muted" id="meta">Loading results…</p><div id="results"></div></section></main><script type="module">
import{createClient}from"https://esm.sh/@supabase/supabase-js@2";const sb=createClient("https://gprdmwjqgyrvqrgjkycc.supabase.co","sb_publishable_uBlQa2v-VS9OYVRk3FEE4A_CwmVPVH4");const $=id=>document.getElementById(id),sid=new URLSearchParams(location.search).get("session");const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function load(){if(!sid)throw Error("Missing session ID.");const{data:s,error}=await sb.from("quiz_sessions").select("id,pin,status,created_at,quizzes(title)").eq("id",sid).single();if(error)throw error;$("title").textContent=s.quizzes.title;$("meta").textContent="PIN "+s.pin+" · "+s.status+" · "+new Date(s.created_at).toLocaleString();const{data:players,error:e}=await sb.from("quiz_players").select("nickname,score").eq("session_id",sid).order("score",{ascending:false});if(e)throw e;$("results").innerHTML=(players||[]).map((p,i)=>`<div class="item"><strong>#${i+1} ${esc(p.nickname)}</strong><span class="score">${p.score} points</span></div>`).join("")||'<p class="muted">No players yet.</p>'}
load().catch(e=>$("meta").textContent=e.message);
</script></body></html>
