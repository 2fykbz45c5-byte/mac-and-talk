
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mac&Talk — Accept Invitation</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f4f5fb;
      font-family: Arial, sans-serif;
      color: #222;
    }
    .card {
      width: min(90%, 400px);
      padding: 30px;
      box-sizing: border-box;
      text-align: center;
      background: white;
      border-radius: 18px;
      box-shadow: 0 8px 30px #0001;
    }
    button {
      padding: 12px 20px;
      border: 0;
      border-radius: 9px;
      background: #6d4aff;
      color: white;
      cursor: pointer;
      font-size: 16px;
    }
    #message { line-height: 1.6; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Mac&Talk</h1>
    <p id="message">Checking your invitation...</p>
    <button id="loginButton" hidden
      onclick="location.href='admin.html'">
      Go to Mac&Talk
    </button>
  </main>

  <script type="module">
    import { createClient } from
      "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    const SUPABASE_URL =
      "https://gprdmwjqgyrvqrgjkycc.supabase.co";

    const SUPABASE_ANON_KEY =
      "sb_publishable_uBlQa2v-VS9OYVRk3FEE4A_CwmVPVH4";

    const supabase = createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

    const message = document.getElementById("message");
    const loginButton = document.getElementById("loginButton");

    const { data, error } = await supabase.auth.getSession();

    if (error) {
      message.textContent = "Could not check your invitation. Please try again.";
    } else if (data.session) {
      message.textContent =
        "Your invitation has been accepted. You are signed in!";
      loginButton.hidden = false;
    } else {
      message.textContent =
        "Open the invitation link from your email. If it has expired, ask your administrator to send another invitation.";
    }
  </script>
</body>
</html>
