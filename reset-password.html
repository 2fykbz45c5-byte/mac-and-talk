<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10243e"><title>Set New Password | Mac&Talk</title><style>:root{--navy:#10243e;--yellow:#ffc629;--bg:#f3f6fb;--line:#e5eaf1;--muted:#718096;--red:#b42318;--green:#18794e}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--bg);font-family:Arial,sans-serif;color:var(--navy)}main{width:100%;max-width:450px;background:white;padding:32px;border-radius:20px;box-shadow:0 12px 40px #10243e15}header{text-align:center;background:var(--navy);color:white;padding:20px;border-radius:13px;margin-bottom:25px}header strong{color:var(--yellow);font-size:27px}h1{font-size:24px;margin-bottom:8px}p{line-height:1.6;color:var(--muted)}label{display:block;margin:16px 0 7px;font-weight:700;font-size:13px}input{width:100%;padding:13px;border:1px solid var(--line);border-radius:9px;font-size:15px}button,a.button{display:block;width:100%;padding:14px;margin-top:18px;border:0;border-radius:9px;background:var(--yellow);color:var(--navy);font-weight:800;text-align:center;text-decoration:none;cursor:pointer}button:disabled{opacity:.6}#message{font-size:14px;overflow-wrap:anywhere}#message.error{color:var(--red)}#message.success{color:var(--green)}.secondary{background:#eef2f8!important}</style></head><body><main><header><strong>Mac&Talk</strong><p style="color:#dbe4f2;margin:6px 0 0">ACCOUNT SECURITY</p></header><h1>Set a new password</h1><p>Choose a new password for your Mac&Talk account.</p><p id="message" role="status" aria-live="polite">Checking your password-reset link…</p><form id="resetForm" hidden><label for="password">New password</label><input id="password" type="password" minlength="8" maxlength="128" autocomplete="new-password" required placeholder="At least 8 characters"><label for="confirmPassword">Confirm new password</label><input id="confirmPassword" type="password" minlength="8" maxlength="128" autocomplete="new-password" required placeholder="Repeat the new password"><button id="saveBtn" type="submit">Update password</button></form><a class="button secondary" href="login.html">Back to sign in</a></main><script type="module">
import {createClient} from "https://esm.sh/@supabase/supabase-js@2";
const supabase=createClient("https://gprdmwjqgyrvqrgjkycc.supabase.co","sb_publishable_uBlQa2v-VS9OYVRk3FEE4A_CwmVPVH4",{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const form=document.getElementById("resetForm"),message=document.getElementById("message"),button=document.getElementById("saveBtn");
function say(t,k=""){message.textContent=t;message.className=k;}
let recoveryReady=false;
supabase.auth.onAuthStateChange((event,session)=>{if(event==="PASSWORD_RECOVERY"||session){recoveryReady=true;form.hidden=false;say("Enter and confirm your new password.");}});
try{const {data,error}=await supabase.auth.getSession();if(error)throw error;if(data.session){recoveryReady=true;form.hidden=false;say("Enter and confirm your new password.");}else if(location.hash.includes("access_token")||location.hash.includes("error_description")){await new Promise(r=>setTimeout(r,600));const result=await supabase.auth.getSession();if(result.data.session){recoveryReady=true;form.hidden=false;say("Enter and confirm your new password.");}else say("This reset link is invalid or expired. Request a new password-reset email.","error");}else say("Open this page from the password-reset link in your email. If the link expired, request another one.","error");}catch(e){say(e.message||"Could not validate the reset link.","error");}
form.addEventListener("submit",async e=>{e.preventDefault();const password=document.getElementById("password").value,confirm=document.getElementById("confirmPassword").value;if(!recoveryReady)return say("Your reset link is not valid. Request a new one.","error");if(password.length<8)return say("Use at least 8 characters.","error");if(password!==confirm)return say("The passwords do not match.","error");button.disabled=true;button.textContent="Updating…";try{const {error}=await supabase.auth.updateUser({password});if(error)throw error;say("Password updated. You can now sign in with your new password.","success");form.hidden=true;await supabase.auth.signOut();}catch(e){say(e.message||"Could not update password.","error");}finally{button.disabled=false;button.textContent="Update password";}});
</script></body></html>
