
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Mac&Talk</title>

    <style>
        :root {
            --navy: #10243e;
            --navy-light: #1c3657;
            --yellow: #ffc629;
            --yellow-hover: #f0b500;
            --white: #ffffff;
            --gray: #667085;
            --border: #dce2e9;
            --error: #c62828;
            --success: #18794e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: Arial, Helvetica, sans-serif;
            color: var(--navy);
            background:
                radial-gradient(circle at top left, #fff0b8, transparent 35%),
                linear-gradient(135deg, #f5f7fb, #e8edf5);
        }

        .register-container {
            width: 100%;
            max-width: 460px;
            padding: 38px;
            background: var(--white);
            border-radius: 22px;
            box-shadow: 0 18px 55px rgba(16, 36, 62, 0.12);
        }

        .brand {
            text-align: center;
            margin-bottom: 28px;
        }

        .brand-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 62px;
            height: 62px;
            margin-bottom: 12px;
            border-radius: 18px;
            background: var(--yellow);
            color: var(--navy);
            font-size: 29px;
            font-weight: 800;
        }

        .brand h1 {
            font-size: 29px;
            letter-spacing: -1px;
        }

        .brand h1 span {
            color: #d99c00;
        }

        .brand p {
            margin-top: 9px;
            color: var(--gray);
            font-size: 14px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 17px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 700;
        }

        .form-group input {
            width: 100%;
            min-height: 48px;
            padding: 13px 14px;
            border: 1px solid var(--border);
            border-radius: 10px;
            outline: none;
            background: #fff;
            color: var(--navy);
            font-size: 15px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-group input:focus {
            border-color: var(--navy-light);
            box-shadow: 0 0 0 3px rgba(28, 54, 87, 0.1);
        }

        .password-wrap {
            position: relative;
        }

        .password-wrap input {
            padding-right: 76px;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            color: var(--navy-light);
            cursor: pointer;
            font-weight: 700;
        }

        .terms {
            display: flex;
            align-items: flex-start;
            gap: 9px;
            margin: 5px 0 20px;
            color: var(--gray);
            font-size: 13px;
            line-height: 1.5;
        }

        .terms input {
            margin-top: 3px;
            accent-color: var(--navy);
        }

        .terms a,
        .login-link a {
            color: var(--navy);
            font-weight: 700;
            text-decoration: none;
        }

        .terms a:hover,
        .login-link a:hover {
            text-decoration: underline;
        }

        .submit-btn {
            width: 100%;
            min-height: 49px;
            padding: 13px;
            border: none;
            border-radius: 10px;
            background: var(--yellow);
            color: var(--navy);
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
        }

        .submit-btn:hover {
            background: var(--yellow-hover);
            transform: translateY(-1px);
        }

        .submit-btn:disabled {
            opacity: 0.65;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            display: none;
            margin-bottom: 16px;
            padding: 12px;
            border-radius: 9px;
            font-size: 13px;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        .message.error {
            display: block;
            color: var(--error);
            background: #fff0f0;
        }

        .message.success {
            display: block;
            color: var(--success);
            background: #eaf8f0;
        }

        .login-link {
            margin-top: 23px;
            text-align: center;
            color: var(--gray);
            font-size: 14px;
        }

        .footer {
            margin-top: 25px;
            text-align: center;
            color: #8a94a4;
            font-size: 12px;
        }

        @media (max-width: 480px) {
            body {
                padding: 14px;
            }

            .register-container {
                padding: 27px 21px;
                border-radius: 17px;
            }

            .brand h1 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>
    <main class="register-container">

        <header class="brand">
            <div class="brand-icon" aria-hidden="true">M&T</div>
            <h1>Mac<span>&</span>Talk</h1>
            <p>Create your account and join the conversation.</p>
        </header>

        <div id="message" class="message"
             role="status" aria-live="polite"></div>

        <form id="registerForm">
            <div class="form-group">
                <label for="fullName">Full name</label>
                <input
                    type="text"
                    id="fullName"
                    name="fullName"
                    placeholder="Enter your full name"
                    autocomplete="name"
                    maxlength="80"
                    required
                >
            </div>

            <div class="form-group">
                <label for="email">Email address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="you@example.com"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="password-wrap">
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="At least 6 characters"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    >
                    <button
                        class="toggle-password"
                        type="button"
                        data-target="password"
                    >Show</button>
                </div>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm password</label>
                <div class="password-wrap">
                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Enter your password again"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    >
                    <button
                        class="toggle-password"
                        type="button"
                        data-target="confirmPassword"
                    >Show</button>
                </div>
            </div>

            <label class="terms">
                <input type="checkbox" id="acceptTerms" required>
                <span>
                    I agree to the
                    <a href="terms.html">Terms of Service</a>
                    and
                    <a href="privacy.html">Privacy Policy</a>.
                </span>
            </label>

            <button type="submit" class="submit-btn" id="submitBtn">
                Create Account
            </button>
        </form>

        <p class="login-link">
            Already have an account?
            <a href="login.html">Sign in</a>
        </p>

        <p class="footer">
            &copy; <span id="year"></span> Mac&Talk. All rights reserved.
        </p>
    </main>

    <script type="module">
        import { initializeApp } from
            "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

        import {
            getAuth,
            createUserWithEmailAndPassword,
            updateProfile,
            setPersistence,
            browserLocalPersistence
        } from
            "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

        import {
            getFirestore,
            doc,
            setDoc,
            serverTimestamp
        } from
            "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCqW8hGILycifGkXw5HqaRKuMgYIl7aiLc",
            authDomain: "macandtalk-e3436.firebaseapp.com",
            projectId: "macandtalk-e3436",
            storageBucket: "macandtalk-e3436.firebasestorage.app",
            messagingSenderId: "562396248377",
            appId: "1:562396248377:web:f139a163870e51a48610e8",
            measurementId: "G-G0DMB0VRGR"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const form = document.getElementById("registerForm");
        const fullNameInput = document.getElementById("fullName");
        const emailInput = document.getElementById("email");
        const passwordInput = document.getElementById("password");
        const confirmPasswordInput =
            document.getElementById("confirmPassword");
        const submitBtn = document.getElementById("submitBtn");
        const messageBox = document.getElementById("message");

        document.getElementById("year").textContent =
            new Date().getFullYear();

        function showMessage(message, type = "error") {
            messageBox.textContent = message;
            messageBox.className = `message ${type}`;
        }

        function friendlyError(error) {
            switch (error.code) {
                case "auth/email-already-in-use":
                    return "This email already has an account. Try signing in.";

                case "auth/invalid-email":
                    return "Please enter a valid email address.";

                case "auth/weak-password":
                    return "Choose a stronger password with at least 6 characters.";

                case "auth/operation-not-allowed":
                    return "Email/password registration is disabled in Firebase Authentication.";

                case "auth/network-request-failed":
                    return "Network error. Check your internet connection and try again.";

                case "auth/too-many-requests":
                    return "Too many attempts. Please wait a while and try again.";

                case "auth/unauthorized-domain":
                    return "This website domain is not authorized in Firebase Authentication settings.";

                case "permission-denied":
                case "firestore/permission-denied":
                    return "Firestore denied access. Check your Firestore Security Rules.";

                default:
                    console.error("Registration error:", error);
                    return "Something went wrong. Check the browser console for details.";
            }
        }

        // Show or hide passwords
        document.querySelectorAll(".toggle-password").forEach(button => {
            button.addEventListener("click", () => {
                const input = document.getElementById(button.dataset.target);
                const showing = input.type === "text";

                input.type = showing ? "password" : "text";
                button.textContent = showing ? "Show" : "Hide";
            });
        });

        form.addEventListener("submit", async event => {
            event.preventDefault();

            const fullName = fullNameInput.value.trim();
            const email = emailInput.value.trim();
            const password = passwordInput.value;
            const confirmPassword = confirmPasswordInput.value;

            messageBox.className = "message";
            messageBox.textContent = "";

            if (!fullName) {
                showMessage("Please enter your full name.");
                fullNameInput.focus();
                return;
            }

            if (password.length < 6) {
                showMessage(
                    "Your password must contain at least 6 characters."
                );
                passwordInput.focus();
                return;
            }

            if (password !== confirmPassword) {
                showMessage("The passwords do not match.");
                confirmPasswordInput.focus();
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = "Creating account...";

            let accountCreated = false;

            try {
                await setPersistence(auth, browserLocalPersistence);

                // 1. Create the Firebase Authentication account
                const credential = await createUserWithEmailAndPassword(
                    auth,
                    email,
                    password
                );

                const user = credential.user;
                accountCreated = true;

                // 2. Save the name in Firebase Authentication
                await updateProfile(user, {
                    displayName: fullName
                });

                // 3. Save private and public profile documents
                // Both documents use the Firebase Authentication UID.
                await Promise.all([
                    setDoc(doc(db, "users", user.uid), {
                        displayName: fullName,
                        email: user.email,
                        createdAt: serverTimestamp()
                    }),

                    setDoc(doc(db, "publicProfiles", user.uid), {
                        displayName: fullName,
                        photoURL: "",
                        createdAt: serverTimestamp()
                    })
                ]);

                // 4. Redirect only after both writes succeed
                showMessage(
                    "Account created and profile saved! Redirecting...",
                    "success"
                );

                window.location.replace("user.html");

            } catch (error) {
                console.error("Registration or profile error:", error);

                if (accountCreated) {
                    showMessage(
                        "Your account was created, but profile setup did not finish. " +
                        "Check Firestore Rules and the browser console. " +
                        "Your account already exists, so don't register again " +
                        "with the same email; sign in after fixing the issue."
                    );
                } else {
                    showMessage(friendlyError(error));
                }

                submitBtn.disabled = false;
                submitBtn.textContent = "Create Account";
            }
        });
    </script>
</body>
</html>
