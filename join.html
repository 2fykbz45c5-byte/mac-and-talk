<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Join a Mac&Talk Quiz</title><style>
:root{--navy:#10243e;--yellow:#ffc629;--bg:#f3f6fb;--line:#e5eaf1;--muted:#718096}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px Inter,Arial,sans-serif;color:var(--navy)}header{background:var(--navy);color:white;padding:18px 24px;font-weight:900}header span{color:var(--yellow)}main{max-width:520px;margin:8vh auto;padding:18px}.panel{background:#fff;border:1px solid var(--line);border-radius:17px;padding:25px;box-shadow:0 12px 35px #10243e12}h1{margin:0 0 8px;font-size:26px}p{color:var(--muted);line-height:1.6}.field{margin:15px 0}.field label{display:block;font-weight:800;font-size:12px;margin-bottom:7px}.field input{width:100%;padding:13px;border:1px solid var(--line);border-radius:10px;font:inherit;color:var(--navy)}button{width:100%;border:0;border-radius:10px;background:var(--navy);color:white;padding:13px;font-weight:800;cursor:pointer}.notice{display:none;margin:12px 0;padding:12px;border-radius:10px;background:#fff0f1;color:#a52d3a}.notice.show{display:block}.tiny{text-align:center;font-size:12px}
</style></head><body><header>Mac<span>&</span>Talk · Quiz</header><main><section class="panel"><h1>Join the quiz</h1><p>Enter the PIN provided by your teacher and choose a nickname. No account is needed.</p><div id="notice" class="notice"></div><div class="field"><label for="pin">QUIZ PIN</label><input id="pin" inputmode="numeric" maxlength="6" placeholder="6-digit PIN"></div><div class="field"><label for="nickname">YOUR NICKNAME</label><input id="nickname" maxlength="24" placeholder="Enter a nickname"></div><button id="join">Join waiting room</button><p class="tiny">Mac&Talk classroom quiz</p></section></main>
<script type="module">
import{createClient}from"https://esm.sh/@supabase/supabase-js@2";
const supabase=createClient("https://gprdmwjqgyrvqrgjkycc.supabase.co","sb_publishable_uBlQa2v-VS9OYVRk3FEE4A_CwmVPVH4");
const $=id=>document.getElementById(id);const qs=new URLSearchParams(location.search);if(qs.get("pin"))$("pin").value=qs.get("pin");
function show(t){$("notice").textContent=t;$("notice").classList.add("show")}
$("join").onclick=async()=>{const pin=$("pin").value.trim(),nickname=$("nickname").value.trim();if(!/^\d{6}$/.test(pin)||!nickname)return show("Enter a six-digit PIN and a nickname.");$("join").disabled=true;$("join").textContent="Joining…";try{const{data,error}=await supabase.rpc("quiz_join",{p_pin:pin,p_nickname:nickname});if(error)throw error;sessionStorage.setItem("quiz_token_"+data.session_id,data.player_token);location.href="quiz-live.html?session="+encodeURIComponent(data.session_id)}catch(e){show(e.message);$("join").disabled=false;$("join").textContent="Join waiting room"}};
</script></body></html>
